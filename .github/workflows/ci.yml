name: build-and-test

# Build the app and run the headless unit-test suite (--run-tests exits
# non-zero on any failure) on every push / PR to main. Mirrors the local
# recipe in CLAUDE.md: Xcode generator, Debug assertions plus Release.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      # Pin third-party actions to immutable commits so a
      # moved tag cannot inject code into the release build.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # JUCE arrives via CMake FetchContent; cache the download so only
      # the first run after a JUCE version bump pays for it.
      - name: Cache JUCE sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_deps
          key: juce-deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      # Both gates run BEFORE the build so a violation fails fast (and so a
      # broken invariant can't be masked by a build error further down).
      # Use the exact tracked lowercase path so this remains portable to a
      # case-sensitive runner/worktree.
      - name: Design-system audit
        run: ./tools/design_audit.sh

      - name: Invariants audit
        run: ./tools/invariants_audit.sh

      - name: Configure
        run: cmake -B build -G Xcode

      # Release-only testing hid JUCE assertions (including duplicate format
      # registration and damaged-session handling). Keep an assertion-enabled
      # run in CI so those regressions fail before shipping.
      - name: Build (Debug)
        run: cmake --build build --config Debug

      - name: Headless tests (Debug)
        run: |
          "build/ZynforgeRecording_artefacts/Debug/Zynforge Recording.app/Contents/MacOS/Zynforge Recording" --run-tests

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Headless tests (Release)
        run: |
          "build/ZynforgeRecording_artefacts/Release/Zynforge Recording.app/Contents/MacOS/Zynforge Recording" --run-tests

      - name: Verify bundled capture daemon
        run: |
          test -x "build/ZynforgeRecording_artefacts/Release/Zynforge Recording.app/Contents/MacOS/ZynforgeCapture"
          codesign --verify --deep --strict "build/ZynforgeRecording_artefacts/Release/Zynforge Recording.app"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-report
          path: ~/Library/Logs/Zynforge/test-report.log
          if-no-files-found: ignore
